name: Security history guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history:
    name: Block credential history
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan every reachable commit
        run: python3 scripts/security/check_secret_history.py
