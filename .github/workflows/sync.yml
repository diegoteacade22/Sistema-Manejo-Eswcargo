name: 🔄 Sincronización Automática (Cloud)
run-name: "Sync ESWCARGO ${{ github.event.inputs.days || '7' }} días"

on:
  schedule:
    # Cambios operativos recientes: máximo 30 minutos de demora.
    - cron: '*/30 * * * *'
    # Revisión total diaria de cambios históricos, separada del ciclo rápido.
    - cron: '5 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub o desde el panel
    inputs:
      days:
        description: 'Sincronización completa recomendada: FULL'
        required: false
        default: 'FULL'

concurrency:
  group: eswcargo-cloud-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⏱️ Iniciar medición de sincronización
        run: |
          echo "SYNC_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "SYNC_ALERT_THRESHOLD_SECONDS=${{ vars.SYNC_ALERT_THRESHOLD_SECONDS || '120' }}" >> "$GITHUB_ENV"

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-sync.txt

      - name: Cachear entorno Python de sincronización
        id: python-runtime
        uses: actions/cache@v4
        with:
          path: .venv
          key: eswcargo-sync-python-3.11-${{ hashFiles('requirements-sync.txt') }}

      - name: 📦 Instalar dependencias Python
        if: steps.python-runtime.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-sync.txt

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Cachear entorno Node de sincronización
        id: node-runtime
        uses: actions/cache@v4
        with:
          path: webapp/node_modules
          key: eswcargo-sync-node-24-${{ hashFiles('webapp/package-lock.json') }}

      - name: 📦 Instalar dependencias Node
        if: steps.node-runtime.outputs.cache-hit != 'true'
        working-directory: ./webapp
        run: npm ci --ignore-scripts --silent

      - name: 🔑 Configurar Credenciales Google
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: 📥 Descargar Excel desde Google Drive
        run: |
          stage_started_at=$(date +%s)
          .venv/bin/python download_sheet.py
          echo "- Descarga de planilla: $(( $(date +%s) - stage_started_at ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 Procesar Datos (Extract)
        env:
          SYNC_DAYS: ${{ github.event.schedule == '5 8 * * *' && 'FULL' || github.event.inputs.days || '7' }}
        run: |
          stage_started_at=$(date +%s)
          .venv/bin/python extract_consolidated.py "$SYNC_DAYS"
          echo "- Extracción de datos: $(( $(date +%s) - stage_started_at ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 Actualizar BD y validar sincronización
        working-directory: ./webapp
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SYNC_DAYS: ${{ github.event.schedule == '5 8 * * *' && 'FULL' || github.event.inputs.days || '7' }}
          ALLOW_FINANCIAL_LEDGER_SYNC: '0'
          ALLOW_LEGACY_LEDGER_CLEANUP: '0'
        run: |
          stage_started_at=$(date +%s)
          export GOOGLE_CREDENTIALS_FILE="$GITHUB_WORKSPACE/google_credentials.json"
          required_files=(
            "$GOOGLE_CREDENTIALS_FILE"
            "lib/sync-item-comparison.ts"
            "prisma/schema.prisma"
            "prisma/seed_fast.ts"
          )
          for required_file in "${required_files[@]}"; do
            if [ ! -s "$required_file" ]; then
              echo "::error::Falta archivo requerido en el runtime de sincronización: $required_file"
              exit 1
            fi
          done
          npx prisma generate --schema prisma/schema.prisma
          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            if [[ "$DIRECT_URL" =~ ^postgres(ql)?:// ]]; then
              echo "::warning::DATABASE_URL no es una URL PostgreSQL válida para Prisma; se usa DIRECT_URL para esta sincronización."
              export DATABASE_URL="$DIRECT_URL"
            else
              echo "::error::DATABASE_URL y DIRECT_URL no son URLs PostgreSQL válidas. Revisar secretos de GitHub Actions."
              exit 1
            fi
          fi
          migrate_with_transient_retry() {
            local attempt=1
            local max_attempts=3
            local retry_delay_seconds=10
            local migrate_output
            local migrate_status

            while true; do
              set +e
              migrate_output="$(npx prisma migrate deploy --schema prisma/schema.prisma 2>&1)"
              migrate_status=$?
              set -e
              printf '%s\n' "$migrate_output"

              if [ "$migrate_status" -eq 0 ]; then
                return 0
              fi

              if ! grep -q 'P1001' <<< "$migrate_output" || [ "$attempt" -ge "$max_attempts" ]; then
                return "$migrate_status"
              fi

              echo "::warning::Supabase no respondió (Prisma P1001). Reintento $(( attempt + 1 ))/$max_attempts en ${retry_delay_seconds}s."
              sleep "$retry_delay_seconds"
              attempt=$(( attempt + 1 ))
            done
          }
          migrate_with_transient_retry
          node scripts/cleanup-legacy-ledger-imports.mjs
          if [ "$SYNC_DAYS" = "0" ] || [ "$SYNC_DAYS" = "FULL" ]; then
            export SYNC_MODE=FULL
            export FULL_AUDIT=1
          else
            export SYNC_MODE=DIFF
            export FULL_AUDIT=0
          fi
          if [ "$FULL_AUDIT" = "1" ]; then
            "$GITHUB_WORKSPACE/.venv/bin/python" scripts/export-cash-flow-raw-transactions.py > /tmp/cashflow-raw-source.json
            node scripts/audit-cash-flow-raw-drift.mjs --source /tmp/cashflow-raw-source.json
            "$GITHUB_WORKSPACE/.venv/bin/python" scripts/audit-cashflow-invoice-references.py --summary
            node scripts/audit-ledgers.mjs || echo "::warning::Auditoria CC previa con advertencias; se continua la sincronizacion operativa."
            node scripts/audit-client-account-coverage.mjs --summary
            node scripts/audit-ledger-duplicates.mjs || echo "::warning::Posibles duplicados o documentos repetidos en Cuenta Corriente; revisar Mantenimiento antes de emitir cobros."
            node scripts/audit-purchase-allocations.mjs
            node scripts/audit-supplier-ledgers.mjs || echo "::warning::Proveedores con movimientos a revisar; no se modificaron saldos automaticamente."
          fi
          npx tsx prisma/seed_fast.ts
          node scripts/audit-shipment-reconciliation.mjs
          PACKING_AUDIT_SCOPE=all node scripts/audit-packing-readiness.mjs
          node scripts/audit-invoice-readiness.mjs
          if [ "$FULL_AUDIT" = "1" ]; then
            node scripts/audit-cash-flow-raw-drift.mjs --source /tmp/cashflow-raw-source.json
            node scripts/audit-ledgers.mjs || echo "::warning::Auditoria CC posterior con advertencias; revisar cuenta corriente sin bloquear sync."
            node scripts/audit-client-account-coverage.mjs --summary
            node scripts/audit-ledger-duplicates.mjs || echo "::warning::Posibles duplicados o documentos repetidos en Cuenta Corriente; revisar Mantenimiento antes de emitir cobros."
            node scripts/audit-purchase-allocations.mjs
            node scripts/audit-supplier-ledgers.mjs || echo "::warning::Proveedores con movimientos a revisar; no se modificaron saldos automaticamente."
          fi
          echo "- Actualización y auditorías: $(( $(date +%s) - stage_started_at ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: ⏱️ Resumen de duración
        if: always()
        run: |
          total_elapsed=$(( $(date +%s) - SYNC_STARTED_AT ))
          echo "## Duración de sincronización" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total: ${total_elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Umbral operativo: ${SYNC_ALERT_THRESHOLD_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total_elapsed" -gt "$SYNC_ALERT_THRESHOLD_SECONDS" ]; then
            echo "::warning::Sincronización demoró ${total_elapsed}s, por encima del umbral de ${SYNC_ALERT_THRESHOLD_SECONDS}s."
            echo "- Alerta: superó el umbral operativo." >> "$GITHUB_STEP_SUMMARY"
          fi
