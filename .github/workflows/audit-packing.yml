name: Auditoría programada de packing lists

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-packing.yml'
      - 'download_sheet.py'
      - 'extract_consolidated.py'
      - 'requirements-sync.txt'
      - 'webapp/prisma/packing-readiness-exceptions.json'
      - 'webapp/prisma/schema.prisma'
      - 'webapp/prisma/shipments_seed.json'
      - 'webapp/scripts/audit-packing-readiness.mjs'
      - 'webapp/scripts/packing-readiness-exceptions.mjs'
      - 'webapp/scripts/packing-readiness-exceptions.test.mjs'
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-packing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Descargar y extraer la fuente vigente
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python -m pip install --disable-pip-version-check -r requirements-sync.txt
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > google_credentials.json
          python download_sheet.py
          python extract_consolidated.py FULL
      - name: Revisar packing lists activos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PACKING_AUDIT_SCOPE: all
        run: |
          AUDIT_RUNTIME="/tmp/eswcargo-packing-audit"
          mkdir -p "$AUDIT_RUNTIME"
          cp -R webapp/prisma "$AUDIT_RUNTIME/prisma"
          cp -R webapp/scripts "$AUDIT_RUNTIME/scripts"
          cd "$AUDIT_RUNTIME"
          npm init -y >/dev/null
          npm install --silent prisma@5.22.0 @prisma/client@5.22.0
          npx prisma generate --schema prisma/schema.prisma
          node --test scripts/packing-readiness-exceptions.test.mjs
          node scripts/audit-packing-readiness.mjs
