name: Auditoria diaria de Cash Flow

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Configurar credenciales de solo lectura
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json
          test -s google_credentials.json || {
            echo "::error::GOOGLE_CREDENTIALS no generó un archivo válido."
            exit 1
          }

      - name: Auditar Cash Flow sin modificar datos
        run: |
          set +e
          python3 audit_cashflow_sheet.py
          audit_status=$?
          set -e

          if [ "$audit_status" -eq 10 ]; then
            echo "::warning::Cash Flow tiene alertas de fórmulas. Se conserva el reporte; no se modifica Google Sheets."
          elif [ "$audit_status" -ne 0 ]; then
            echo "::error::La auditoría de Cash Flow no pudo completarse correctamente (código $audit_status)."
            exit "$audit_status"
          fi

      - name: Conservar reporte de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cashflow-health
          path: audit-output/cashflow-health.json
          if-no-files-found: warn
