name: Company OS Codex Inventory Migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the single verified migration after dry-run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: company-os-codex-inventory-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify exact migration plan
        id: plan
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260827142708_company_os_codex_task_inventory.sql"
          test -f "$migration"
          tables="$(psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM (VALUES (to_regclass('public.\"CompanyOsCodexTask\"')), (to_regclass('public.\"CompanyOsCodexTaskObservation\"')), (to_regclass('public.\"CompanyOsCodexInventorySync\"'))) AS expected(table_name) WHERE table_name IS NOT NULL")"
          history="$(psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version = '20260827142708'")"
          if [ "$tables" = "3" ] && [ "$history" = "1" ]; then
            echo "La migración Codex ya está aplicada y registrada."
            exit 0
          fi
          if [ "$tables" != "0" ] || [ "$history" != "0" ]; then
            echo "::error::Estado parcial inesperado: tablas=$tables historia=$history."
            exit 1
          fi
          {
            echo 'BEGIN;'
            sed -e '/^BEGIN;$/d' -e '/^COMMIT;$/d' "$migration"
            echo 'ROLLBACK;'
          } | psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 >/dev/null
          echo "Plan verificado: una migración, ejecutada y revertida correctamente."

      - name: Apply verified migration
        if: ${{ inputs.apply }}
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260827142708_company_os_codex_task_inventory.sql"
          tables="$(psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM (VALUES (to_regclass('public.\"CompanyOsCodexTask\"')), (to_regclass('public.\"CompanyOsCodexTaskObservation\"')), (to_regclass('public.\"CompanyOsCodexInventorySync\"'))) AS expected(table_name) WHERE table_name IS NOT NULL")"
          history="$(psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version = '20260827142708'")"
          if [ "$tables" = "0" ] && [ "$history" = "0" ]; then
            psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            tables="3"
          fi
          if [ "$tables" = "3" ] && [ "$history" = "0" ]; then
            supabase migration repair 20260827142708 --status applied --db-url "$DIRECT_URL" --yes >/dev/null
          elif [ "$tables" != "3" ] || [ "$history" != "1" ]; then
            echo "::error::Estado parcial inesperado: tablas=$tables historia=$history."
            exit 1
          fi

      - name: Verify migration history
        if: ${{ inputs.apply }}
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          tables="$(psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM (VALUES (to_regclass('public.\"CompanyOsCodexTask\"')), (to_regclass('public.\"CompanyOsCodexTaskObservation\"')), (to_regclass('public.\"CompanyOsCodexInventorySync\"'))) AS expected(table_name) WHERE table_name IS NOT NULL")"
          history="$(psql -X "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version = '20260827142708'")"
          test "$tables" = "3"
          test "$history" = "1"
          echo "Migración Codex aplicada: 3 tablas y 1 registro de historial verificados."
