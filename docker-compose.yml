services:
  eswcargo-webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: eswcargo-webapp
    restart: unless-stopped
    ports:
      - "3002:3000" # Puerto externo 3002 → puerto interno 3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - AUTO_NOTIFY_EMAIL_ENABLED=${AUTO_NOTIFY_EMAIL_ENABLED}
      - AUTO_NOTIFY_WHATSAPP_ENABLED=${AUTO_NOTIFY_WHATSAPP_ENABLED}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
    networks:
      - eswcargo-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode===200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eswcargo-network:
    name: eswcargo-network
    driver: bridge
